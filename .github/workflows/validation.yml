name: gooo-validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Go 1.27.x
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true

      - name: Generate deterministic replay
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gooo"
          go run ./cmd/projector \
            --events fixtures/cases.json \
            --out "$RUNNER_TEMP/gooo/generated-replay.json" \
            --generated-artifact gooo-replay.json

      - name: Fix check
        run: |
          set -euo pipefail
          fix_diff="$RUNNER_TEMP/gooo/go-fix.diff"
          set +e
          go fix -diff ./... > "$fix_diff" 2>&1
          status=$?
          set -e
          if [ -s "$fix_diff" ]; then
            cat "$fix_diff"
            exit 1
          fi
          if [ "$status" -ne 0 ] && [ "$status" -ne 1 ]; then
            exit "$status"
          fi

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Conformance
        run: go test ./projector -run '^TestConformanceFixtureVectors$' -count=1

      - name: Replay
        run: |
          set -euo pipefail
          go run ./cmd/projector \
            --events fixtures/cases.json \
            --out "$RUNNER_TEMP/gooo/replay.json" \
            --generated-artifact gooo-replay.json

      - name: Measurement
        run: |
          set -euo pipefail
          go run ./cmd/projector \
            --events fixtures/cases.json \
            --out "$RUNNER_TEMP/gooo/measurement.json" \
            --measure \
            --generated-artifact gooo-replay.json

      - name: Inventory
        run: |
          set -euo pipefail
          go_lines="$(find . -type f -name '*.go' -not -path './.git/*' -print0 | xargs -0 awk '{n += 1} END {print n + 0}')"
          gooo_lines="$(awk 'END {print NR + 0}' .gooo)"
          jq -n \
            --argjson go_lines "$go_lines" \
            --argjson gooo_lines "$gooo_lines" \
            '{readme_excluded:true, go_lines:$go_lines, gooo_lines:$gooo_lines, cells:12, activities:12, scalar_outputs:"forbidden"}' \
            > "$RUNNER_TEMP/gooo/inventory.json"

      - name: Upload generated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gooo-validation-${{ github.run_id }}
          path: ${{ runner.temp }}/gooo
          if-no-files-found: error
          retention-days: 14
