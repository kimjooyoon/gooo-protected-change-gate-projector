name: gooo-release-evidence

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  release-evidence:
    name: release-evidence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout immutable tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Go 1.27.x
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true

      - name: Replay and measure tagged source
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gooo-release"
          go test ./...
          go run ./cmd/projector --events fixtures/cases.json --out "$RUNNER_TEMP/gooo-release/conformance.json" --generated-artifact gooo-release-conformance.json
          go run ./cmd/projector --events fixtures/cases.json --out "$RUNNER_TEMP/gooo-release/replay.json" --generated-artifact gooo-release-replay.json
          go run ./cmd/projector --events fixtures/cases.json --out "$RUNNER_TEMP/gooo-release/measurement.json" --measure --generated-artifact gooo-release-replay.json
          for evidence in conformance.json replay.json measurement.json; do
            jq -e '
              (.proof_choice_counts == {"FOUNDATION":4,"COHERENCE":4,"REGRESSION":4}) and
              (.indicator_counts == {"DRIVER":4,"OUTCOME":4,"GUARDRAIL":4}) and
              (all(.cases[]; (.proof_choice | type) == "string" and (.indicator | type) == "string")) and
              (all(.cases[].projection; (.proof_choice | type) == "string" and (.indicator | type) == "string"))
            ' "$RUNNER_TEMP/gooo-release/$evidence"
          done
          sha256sum "$RUNNER_TEMP/gooo-release"/* > "$RUNNER_TEMP/gooo-release/SHA256SUMS"

      - name: Upload tagged evidence
        uses: actions/upload-artifact@v4
        with:
          name: gooo-release-evidence-${{ github.ref_name }}-${{ github.run_id }}
          path: ${{ runner.temp }}/gooo-release
          if-no-files-found: error
          retention-days: 14
